# journald do dispensador: não deixa o log encher o cartão SD.
# Local de instalação: /etc/systemd/journald.conf.d/10-dispenser.conf
#
# Sem isto o journal cresce sem teto: meses de doses e erros de sync matariam
# o cartão. Aqui limitamos por tamanho e por tempo, e usamos journal volátil
# (tmpfs, RAM) para que o log de uma partida não vire escrita permanente.
# O que importa para auditoria fica no SQLite (log_eventos) e no Firestore.

[Journal]
Storage=volatile
RuntimeMaxUse=32M
# Também limita o journal persistente, caso alguém troque Storage depois.
SystemMaxUse=64M
SystemMaxFileSize=8M
MaxRetentionSec=1month
ForwardToSyslog=no
ForwardToKMsg=no
ForwardToWall=no
RateLimitIntervalSec=30s
RateLimitBurst=10000
Compress=yes
Seal=no
